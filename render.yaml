# Render Blueprint: New + > Blueprint > pick this repo. API keys are asked for in the dashboard (never stored in git).
services:
  - type: web
    name: bear-light
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: REVIEW_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
